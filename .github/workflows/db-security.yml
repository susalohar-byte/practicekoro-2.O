name: DB Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/**'
      - '.github/workflows/db-security.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/**'
      - '.github/workflows/db-security.yml'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- anon edge probe
  # Runs WITHOUT secrets: the Supabase URL and anon key are public by design.
  # Verifies RLS actually holds at the API edge (the way a real visitor sees it).
  anon-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe production API as anonymous
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY repository variables not set - anon probe skipped. Set them to enforce edge security in CI."
            exit 0
          fi
          python3 scripts/prod-anon-probe.py

  # ---------------------------------------------------------------- SQL assertions
  # Needs a DB connection; requires the SUPABASE_DB_URL secret.
  rls-assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Guard - require DB URL secret
        id: guard
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not set - SQL assertions SKIPPED (this is NOT a pass). Add the secret to enforce DB checks."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RLS/security assertions against Supabase
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/supabase-sql.sh
          ./scripts/supabase-sql.sh -f supabase/tests/rls_security.sql -t -A | tee rls-results.json
          python3 - <<'PY'
          import json, sys
          ok = True
          checked = 0
          for line in open('rls-results.json'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              row = json.loads(line)
              for k, v in row.items():
                  checked += 1
                  if v is not True:
                      ok = False
                      print('FAILED ASSERTION:', k, '=', v)
          if checked == 0:
              print('ERROR: no assertions were evaluated - treating as failure')
              sys.exit(1)
          if not ok:
              sys.exit(1)
          print(f'All {checked} DB security assertions passed.')
          PY
